[package]
name = "oxymesh-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
mc-core = { path = "../crates/mc-core" }
mc-air = { path = "../crates/mc-air" }
mc-proto = { path = "../crates/mc-proto" }
mc-nmea = { path = "../crates/mc-nmea" }
mc-spiffs = { path = "../crates/mc-spiffs" }
mc-node = { path = "../crates/mc-node" }
rand_chacha = { version = "0.10", default-features = false }

# Separate workspace: nightly toolchain and instrumentation specific to fuzzing.
[workspace]
members = ["."]

[[bin]]
name = "air_decode"
path = "fuzz_targets/air_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cli_command"
path = "fuzz_targets/cli_command.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cmd_decode"
path = "fuzz_targets/cmd_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "nmea_parse"
path = "fuzz_targets/nmea_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "spiffs_read"
path = "fuzz_targets/spiffs_read.rs"
test = false
doc = false
bench = false
