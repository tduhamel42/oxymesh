name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # mc-cli's Bluetooth client (btleplug) talks to BlueZ over D-Bus.
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - run: CI_SKIP_FUZZ=1 CI_SKIP_FIRMWARE=1 scripts/ci.sh

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: esp-rs/xtensa-toolchain@v1.7.0
        with:
          buildtargets: esp32s3
          version: 1.97.0.0
          ldproxy: false
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: firmware/esp32s3
      - run: cargo build --release
        working-directory: firmware/esp32s3

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      - run: scripts/fuzz.sh 60
