# Profil réglementaire UE 863-870 MHz, dispositifs à courte portée non spécifiques (France).
# Vérifié le 2026-11-03 contre les sources primaires (détail et URL dans l’ADR-0006 de loranet, d’où vient ce fichier) :
#   - CEPT ERC/REC 70-03, édition du 9 octobre 2026, annexe 1, table 1 (h1.3 à h1.9) ;
#   - décision 2006/771/CE modifiée par la décision d'exécution (UE) 2025/105, annexe, table 2 ;
#   - Arcep, décision n° 2014-1263 modifiée par n° 2023-1412 (mêmes valeurs pour 863-870 MHz).
# Puissances en ERP. Duty cycle : par émetteur, par sous-bande, sur une période continue d'une
# heure ; les sources ne précisent pas si la fenêtre est glissante, l'oracle utilise une fenêtre
# glissante, plus stricte qu'une fenêtre fixe.
#
# `polite_access = true` : l'accès poli (LBT + AFA, EN 300 220-2 V3.3.1 §4.4.3) peut remplacer le
# duty cycle. Il n'est pas encore modélisé : les nœuds respectent toujours le duty cycle.
#
# Une sous-bande à plusieurs régimes (h1.8/h1.9) donne plusieurs règles ; le simulateur et les
# nœuds appliquent la plus permissive qui admet l'émission (fréquence et puissance).

name = "eu868"
window_s = 3600
status = "vérifié le 2026-11-03"

[[rule]]
name = "h1.3"
low_hz = 863000000
high_hz = 865000000
max_erp_mw = 25
duty_percent = 0.1
polite_access = true
verified = true
source = "ERC/REC 70-03 annexe 1 h1.3 ; (UE) 2025/105"

[[rule]]
name = "h1.4"
low_hz = 865000000
high_hz = 868000000
max_erp_mw = 25
duty_percent = 1.0
polite_access = true
verified = true
source = "ERC/REC 70-03 annexe 1 h1.4 ; (UE) 2025/105"

[[rule]]
name = "g1"
low_hz = 868000000
high_hz = 868600000
max_erp_mw = 25
duty_percent = 1.0
polite_access = true
verified = true
source = "ERC/REC 70-03 annexe 1 h1.5 ; (UE) 2025/105"

[[rule]]
name = "g2"
low_hz = 868700000
high_hz = 869200000
max_erp_mw = 25
duty_percent = 0.1
polite_access = true
verified = true
source = "ERC/REC 70-03 annexe 1 h1.6 ; (UE) 2025/105"

[[rule]]
name = "g3"
low_hz = 869400000
high_hz = 869650000
max_erp_mw = 500
duty_percent = 10.0
polite_access = true
verified = true
source = "ERC/REC 70-03 annexe 1 h1.7 ; (UE) 2025/105"

[[rule]]
name = "g4-5mw"
low_hz = 869700000
high_hz = 870000000
