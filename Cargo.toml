[workspace]
resolver = "3"
members = ["crates/*"]
# fuzz/ and firmware/ have their own workspace (different toolchains).
exclude = ["fuzz", "firmware"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
publish = false
license = "MIT"
repository = "https://github.com/tduhamel42/oxymesh"

[workspace.dependencies]
# Internal
mc-core = { path = "crates/mc-core" }
mc-air = { path = "crates/mc-air" }
mc-proto = { path = "crates/mc-proto" }
mc-node = { path = "crates/mc-node" }
mc-sim = { path = "crates/mc-sim" }
mc-nmea = { path = "crates/mc-nmea" }
mc-spiffs = { path = "crates/mc-spiffs" }

# no_std
heapless = { version = "0.9", default-features = false }
rand_core = { version = "0.10", default-features = false }
aes = { version = "0.9", default-features = false }
hmac = { version = "0.13", default-features = false }
sha2 = { version = "0.11", default-features = false }
ed25519-dalek = { version = "3.0", default-features = false, features = ["hazmat"] }
curve25519-dalek = { version = "5.0", default-features = false }

rand_chacha = { version = "0.10", default-features = false, features = ["std"] }

# std only (simulator, CLI, tests)
proptest = "1.12"
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
clap = { version = "4.6", features = ["derive"] }
serialport = { version = "4.10", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
debug = 1

[profile.test]
opt-level = 1
