[package]
edition      = "2024"
name         = "oxymesh-esp32s3"
rust-version = "1.95"
version      = "0.1.0"

# MeshCore-compatible firmware for the ESP32-S3 (ThinkNode M5 first). Separate workspace: Xtensa
# `esp` toolchain. Taken from loranet (firmware/esp32s3) for the esp-hal base and the SX1262 driver.

[[bin]]
name = "mc-m5"
path = "./src/bin/mc-m5.rs"

# U0 spike (docs/decisions/0008): Ratatui + mousefood on the e-paper, heap and timing measurements.
[[bin]]
name = "ui-spike"
path = "./src/bin/ui-spike.rs"

[dependencies]
esp-hal = { version = "~1.2.2", features = ["esp32s3", "log-04", "unstable"] }
esp-rtos = { version = "0.4.0", features = ["embassy", "esp32s3", "log-04"] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["embedded-storage", "esp32s3", "log-04"] }
log = "0.4.27"
embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-time = { version = "0.5.0", features = ["log"] }
esp-backtrace = { version = "0.20.0", features = ["esp32s3", "panic-handler", "println"] }
esp-println = { version = "0.18.0", features = ["esp32s3", "log-04"] }
critical-section = "1.2.0"
static_cell = "2.1.1"
heapless = { version = "0.9", default-features = false }
rand_core = { version = "0.10", default-features = false }
rand_chacha = { version = "0.10", default-features = false }
embedded-graphics = "0.8"

mc-core = { path = "../../crates/mc-core" }
mc-air = { path = "../../crates/mc-air" }
mc-node = { path = "../../crates/mc-node" }
mc-proto = { path = "../../crates/mc-proto" }
mc-ui = { path = "../../crates/mc-ui" }
ratatui-core = { version = "0.1", default-features = false }
esp-alloc = { version = "0.11", features = ["esp32s3", "internal-heap-stats"] }
esp-storage = { version = "0.10", features = ["esp32s3"] }
sequential-storage = "8.0"
embassy-embedded-hal = "0.6"
embedded-storage = "0.3"
embedded-storage-async = "0.4"
embassy-futures = "0.1"

[features]
# Log on UART0: interferes with the companion protocol, for debugging only.
debug-log = []

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug         = 2
lto           = 'fat'
opt-level     = 's'
