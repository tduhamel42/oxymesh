# Build settings here; runtime settings in `esp-config.toml`.
include = ["esp-config.toml"]

[target.xtensa-esp32s3-none-elf]
# oxymesh partition table (ADR-0006): the C++ firmware's SPIFFS is never written.
runner = "espflash flash --monitor --chip esp32s3 --partition-table partitions.csv"

[build]
rustflags = [
  "-C", "link-arg=-nostartfiles",
]

target = "xtensa-esp32s3-none-elf"

[unstable]
build-std = ["core", "alloc"]
