[package]
name = "mc-cli"
description = "The `mc` binary: query a MeshCore companion over USB, decode what it hears, inject frames, test compatibility"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "mc"
path = "src/main.rs"

[dependencies]
mc-core.workspace = true
mc-air.workspace = true
mc-proto.workspace = true
mc-node.workspace = true
mc-sim.workspace = true
mc-ui = { path = "../mc-ui" }
clap.workspace = true
serialport.workspace = true
rand_core.workspace = true
rand_chacha.workspace = true
ratatui-core = { version = "0.1", default-features = false }
ratatui-widgets = { version = "0.3", default-features = false }
ratatui-crossterm = "0.1"
# Companions over Bluetooth LE (`ble:<name>` ports, `mc ble`).
btleplug = "0.13"
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
futures = "0.3"
uuid = "1"

[lints]
workspace = true
